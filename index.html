<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi P3K PW SMAN 7 Tangsel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* Header Kop Surat */
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px double #1a5276; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .header img { height: 75px; width: auto; object-fit: contain; }
        .header-text h3 { font-size: 14px; color: #555; text-transform: uppercase; }
        .header-text h1 { font-size: 18px; color: #1a5276; margin: 3px 0; font-weight: bold; }
        .header-text p { font-size: 12px; color: #666; }

        /* Card Form */
        .card-title { font-size: 16px; font-weight: bold; color: #1a5276; margin-bottom: 15px; border-bottom: 2px solid #eef2f5; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #444; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }

        /* Radio Options */
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }

        /* Camera Box */
        .camera-container { width: 100%; height: 260px; background-color: #000; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 15px; }
        #webcam, #canvas { width: 100%; height: 100%; object-fit: cover; }
        .gps-overlay { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.65); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; }

        /* Button */
        .btn-submit { width: 100%; padding: 12px; background-color: #0288d1; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background-color: #0277bd; }
        .btn-delete-all { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        /* Table Rekap */
        .table-responsive { overflow-x: auto; margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: center; }
        th { background-color: #1a5276; color: white; }
        .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER LOGO KOP -->
    <div class="header">
        <img src="logo%20banten.jpeg" alt="Logo Banten">
        <div class="header-text">
            <h3>Pemerintah Provinsi Banten</h3>
            <h1>SMAN 7 KOTA TANGERANG SELATAN</h1>
            <p>Sistem Absensi Kehadiran P3K Paruh Waktu</p>
        </div>
        <img src="logo%20sman7tangsel.jpeg" alt="Logo SMAN 7 Tangsel">
    </div>

    <!-- FORMULIR ABSENSI -->
    <div class="card-title">
        <span><i class="fa-solid fa-pen-to-square"></i> Formulir Presensi Pegawai</span>
    </div>
    
    <form id="absensiForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="pegawaiSelect">Nama Lengkap Pegawai</label>
                <!-- DAFTAR NAMA & NIP RESMI SESUAI SPREADSHEET -->
                <select id="pegawaiSelect" required onchange="resetNip()">
                    <option value="">-- Pilih Nama Anda --</option>
                    <option value="198308222025212039" data-nama="Dinnar Mohammad Hasan">Dinnar Mohammad Hasan</option>
                    <option value="200111142025211015" data-nama="Mustakim">Mustakim</option>
                    <option value="197512252025211050" data-nama="NURADI SUMARNA">NURADI SUMARNA</option>
                    <option value="197805102025211106" data-nama="Wawan Setiawan">Wawan Setiawan</option>
                    <option value="198301042025211088" data-nama="Asep nur">Asep nur</option>
                    <option value="197109202025211048" data-nama="Hatta amanu">Hatta amanu</option>
                    <option value="198305122025211009" data-nama="SAHARI">SAHARI</option>
                    <option value="198402112025211005" data-nama="Yadik">Yadik</option>
                    <option value="198101192025211059" data-nama="Suparyadi">Suparyadi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nip">Masukkan NIP / PIN Rahasia</label>
                <input type="password" id="nip" placeholder="Ketik NIP Anda di sini..." required>
                <input type="hidden" id="nama">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Tipe Absensi</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="tipeAbsen" value="Absen Masuk" checked> <i class="fa-solid fa-right-to-bracket" style="color:#1a5276;"></i> ABSEN MASUK
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="tipeAbsen" value="Absen Pulang"> <i class="fa-solid fa-right-from-bracket" style="color:#dc2626;"></i> ABSEN PULANG
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="status">Status Kehadiran</label>
                <select id="status">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>
        </div>

        <!-- PRATINJAU KAMERA & GEOLOKASI -->
        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div class="gps-overlay" id="gpsStatus">Meminta Akses GPS...</div>
        </div>

        <button type="button" class="btn-submit" onclick="prosesAbsensip3k()"><i class="fa-solid fa-camera"></i> Ambil Foto & Simpan Presensi</button>
    </form>

    <!-- REKAPITULASI ABSENSI LOKAL PEGAWAI -->
    <div class="table-responsive">
        <div class="card-title" style="margin-top: 20px;">
            <span><i class="fa-solid fa-list-check"></i> Riwayat Absensi Anda Hari Ini</span>
            <button type="button" class="btn-delete-all" onclick="hapusRiwayatLokal()"><i class="fa-solid fa-trash"></i> Bersihkan Tampilan</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Waktu</th>
                    <th>Tipe</th>
                    <th>Nama</th>
                    <th>Status</th>
                    <th>Lokasi</th>
                    <th>Foto</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelAbsensiBody">
                <tr><td colspan="8">Belum ada data absensi.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvzuZnKiDdDrVMHKKLnC2HK_JfhbjsuZd9rfZAhMWxLOIXnTiUEU1-rfEO-jIz1Fkseg/exec";
    
    let userLokasi = "Mencari Lokasi...";
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');

    window.onload = function() {
        initKamera();
        initGPS();
        muatTabelRiwayat();
    };

    function initKamera() {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal mengakses kamera: " + err); });
    }

    function initGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLokasi = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                    document.getElementById('gpsStatus').innerText = "GPS Aktif: " + userLokasi;
                },
                err => {
                    userLokasi = "GPS Tidak Aktif";
                    document.getElementById('gpsStatus').innerText = userLokasi;
                }
            );
        }
    }

    function resetNip() {
        var select = document.getElementById("pegawaiSelect");
        var selectedOption = select.options[select.selectedIndex];
        document.getElementById("nama").value = selectedOption.getAttribute("data-nama") || "";
        document.getElementById("nip").value = "";
    }

    function murniCekAbsenHarian(namaPegawai, tipeAbsen) {
        let listAbsensi = JSON.parse(localStorage.getItem('absensi_p3k_v3')) || [];
        let hariIniStr = new Date().toLocaleDateString('id-ID');

        let sudahAda = listAbsensi.some(item => {
            let tglItemStr = new Date(item.waktuIso || Date.now()).toLocaleDateString('id-ID');
            return item.nama === namaPegawai && item.tipe === tipeAbsen && tglItemStr === hariIniStr;
        });

        if (sudahAda) {
            alert(`Perhatian! Pegawai a.n ${namaPegawai} Selesai Melakukan "${tipeAbsen}" Hari Ini!`);
            return false;
        }
        return true;
    }

    function prosesAbsensip3k() {
        const select = document.getElementById("pegawaiSelect");
        const nipBenar = select.value; 
        const nipInput = document.getElementById("nip").value.trim(); 
        const nama = document.getElementById("nama").value;
        const tipeAbsen = document.querySelector('input[name="tipeAbsen"]:checked').value;
        const status = document.getElementById('status').value;

        if (!nama || !nipBenar) {
            alert("Silakan pilih Nama Pegawai terlebih dahulu!");
            return;
        }

        if (!nipInput) {
            alert("Silakan ketik NIP / PIN Rahasia Anda!");
            return;
        }

        if (nipInput !== nipBenar) {
            alert("NIP / PIN Rahasia SALAH! Silakan periksa kembali NIP Anda.");
            return;
        }

        if (!murniCekAbsenHarian(nama, tipeAbsen)) {
            return;
        }

        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const fotoDataUrl = canvas.toDataURL('image/jpeg', 0.7);

        const waktuSekarang = new Date().toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'medium' });

        const dataBaru = {
            waktu: waktuSekarang,
            waktuIso: new Date().toISOString(),
            tipe: tipeAbsen,
            nip: nipInput,
            nama: nama,
            status: status,
            lokasi: userLokasi,
            foto: fotoDataUrl
        };

        simpanKeGoogleSheets(dataBaru);
    }

    function simpanKeGoogleSheets(data) {
        let listAbsensi = JSON.parse(localStorage.getItem('absensi_p3k_v3')) || [];
        listAbsensi.unshift(data);
        localStorage.setItem('absensi_p3k_v3', JSON.stringify(listAbsensi));
        muatTabelRiwayat();

        const formData = new URLSearchParams();
        formData.append("waktu", data.waktu);
        formData.append("tipe", data.tipe);
        formData.append("nip", data.nip);
        formData.append("nama", data.nama);
        formData.append("status", data.status);
        formData.append("lokasi", data.lokasi);
        formData.append("foto", data.foto);

        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.text())
            .then(resText => {
                alert(`Presensi (${data.tipe}) berhasil disimpan & terkirim ke Google Sheets!`);
            })
            .catch(err => {
                console.error("Gagal kirim data:", err);
            });
    }

    function muatTabelRiwayat() {
        let listAbsensi = JSON.parse(localStorage.getItem('absensi_p3k_v3')) || [];
        const tbody = document.getElementById('tabelAbsensiBody');
        tbody.innerHTML = "";

        if (listAbsensi.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">Belum ada data absensi.</td></tr>';
            return;
        }

        listAbsensi.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.waktu}</td>
                <td><b>${item.tipe}</b></td>
                <td>${item.nama}</td>
                <td>${item.status}</td>
                <td>${item.lokasi}</td>
                <td><img src="${item.foto}" class="img-preview"></td>
                <td><button onclick="hapusBarisPerSatu(${index})" style="color:red; border:none; background:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function hapusBarisPerSatu(index) {
        if (confirm("Hapus baris riwayat ini dari tampilan HP Anda?")) {
            let listAbsensi = JSON.parse(localStorage.getItem('absensi_p3k_v3')) || [];
            listAbsensi.splice(index, 1);
            localStorage.setItem('absensi_p3k_v3', JSON.stringify(listAbsensi));
            muatTabelRiwayat();
        }
    }

    function hapusRiwayatLokal() {
        if (confirm("Bersihkan seluruh riwayat lokal di perangkat ini?")) {
            localStorage.removeItem('absensi_p3k_v3');
            muatTabelRiwayat();
        }
    }
</script>
</body>
</html>
