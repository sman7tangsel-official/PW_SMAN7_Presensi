<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi P3K PW SMAN 7 Tangerang Selatan</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .card-header-custom { background-color: #ffffff; border-bottom: 2px solid #0d6efd; }
    #webcam { width: 100%; max-width: 400px; height: auto; border-radius: 8px; border: 2px solid #dee2e6; }
    #canvas { display: none; }
    .logo-img { height: 65px; width: auto; object-fit: contain; }
    @media print {
      .no-print { display: none !important; }
      .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
      .card { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="container my-4">
    <!-- Header Branding -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <div class="d-flex justify-content-between align-items-center">
          <img id="imgLogoBanten" class="logo-img" alt="Logo Banten" src="./logo banten.jpeg">
          <div>
            <h5 class="fw-bold mb-0">PEMERINTAH PROVINSI BANTEN</h5>
            <h4 class="fw-bold text-primary mb-0">SMAN 7 KOTA TANGERANG SELATAN</h4>
            <small class="text-muted">Sistem Absensi Kehadiran P3K Paruh Waktu</small>
          </div>
          <img id="imgLogoSekolah" class="logo-img" alt="Logo Sekolah" src="./logo sman7tangsel.jpeg">
        </div>
      </div>
    </div>

    <!-- Form Presensi Kehadiran Pegawai -->
    <div class="card mb-4 shadow-sm no-print">
      <div class="card-header bg-primary text-white">
        <h6 class="fw-bold mb-0">📝 Formulir Presensi Pegawai</h6>
      </div>
      <div class="card-body">
        <form id="formAbsensi" onsubmit="kirimAbsensi(event)">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label fw-bold">Nama Lengkap Pegawai</label>
              <select id="selectNama" class="form-select" required>
                <option value="">-- Pilih Nama Anda --</option>
                <option value="Dinnar Mohammad Hasan" data-nip="198308222025212039">Dinnar Mohammad Hasan</option>
                <option value="Mustakim" data-nip="200111142025211015">Mustakim</option>
                <option value="Nuradi sumarna" data-nip="197512252025211050">Nuradi sumarna</option>
                <option value="Wawan setiawan" data-nip="197805102025211106">Wawan setiawan</option>
                <option value="Asep nur" data-nip="198301042025211088">Asep nur</option>
                <option value="Hatta Amanu" data-nip="199710292025211048">Hatta Amanu</option>
                <option value="Sahari" data-nip="197006142025211030">Sahari</option>
                <option value="Yadik" data-nip="19840102025211096">Yadik</option>
                <option value="Suparyadi" data-nip="198003152025211044">Suparyadi</option>
              </select>
            </div>

            <!-- PIN / NIP Manual Dengan Tombol Mata Intip -->
            <div class="col-md-4">
              <label class="form-label fw-bold">Masukkan NIP / PIN Rahasia</label>
              <div class="input-group">
                <input type="password" id="inputNIP" class="form-control" required placeholder="Ketik NIP Anda di sini...">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePIN()">
                  <i class="bi bi-eye" id="iconMata"></i>
                </button>
              </div>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-bold">Tipe Absensi</label>
              <select id="selectTipe" class="form-select" required>
                <option value="Absen Masuk">📲 ABSEN MASUK</option>
                <option value="Absen Pulang">📲 ABSEN PULANG</option>
              </select>
            </div>

            <!-- Kamera & Lokasi -->
            <div class="col-md-6 text-center my-3">
              <label class="form-label fw-bold d-block">Pratinjau Kamera</label>
              <video id="webcam" autoplay playsinline></video>
              <canvas id="canvas"></canvas>
              <input type="hidden" id="fotoBase64">
              <div class="mt-2">
                <button type="button" class="btn btn-sm btn-secondary" onclick="ambilFoto()">📸 Pratinjau Foto</button>
              </div>
            </div>

            <div class="col-md-6 my-3 d-flex flex-column justify-content-center">
              <label class="form-label fw-bold">Koordinat Lokasi GPS</label>
              <input type="text" id="inputLokasi" class="form-control mb-2" readonly placeholder="Mendeteksi lokasi...">
              <button type="button" class="btn btn-sm btn-outline-primary w-50" onclick="dapatkanLokasi()">📍 Update Lokasi GPS</button>
            </div>

            <!-- Tombol SIMPAN Utama -->
            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary fw-bold px-5 py-2 w-100" id="btnSubmit">📷 Ambil Foto & Simpan Presensi Ke Spreadsheet</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Area Rekapitulasi Absensi Pegawai -->
    <div class="card shadow-sm">
      <div class="card-header card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h6 class="fw-bold mb-0 text-dark">📜 Rekapitulasi Absensi Pegawai</h6>
        
        <div class="d-flex align-items-center gap-2 flex-wrap ms-auto no-print">
          <select id="filterTipe" class="form-select form-select-sm" style="width: auto;" onchange="filterTabelAbsensi()">
            <option value="">Semua Tipe</option>
            <option value="Absen Masuk">Absen Masuk</option>
            <option value="Absen Pulang">Absen Pulang</option>
          </select>

          <span class="small fw-bold">Dari:</span>
          <input type="date" id="filterDari" class="form-control form-control-sm" style="width: auto;" onchange="filterTabelAbsensi()">
          
          <span class="small fw-bold">Sampai:</span>
          <input type="date" id="filterSampai" class="form-control form-control-sm" style="width: auto;" onchange="filterTabelAbsensi()">

          <button class="btn btn-sm btn-success fw-bold" onclick="window.print()">🖨️ Cetak / PDF</button>
          <button class="btn btn-sm btn-danger fw-bold" onclick="resetFilter()">Bersihkan</button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0 text-center" id="tabelAbsensi">
            <thead class="table-dark">
              <tr>
                <th style="width: 5%;">NO</th>
                <th style="width: 20%;">TANGGAL & WAKTU</th>
                <th style="width: 12%;">TIPE</th>
                <th style="width: 12%;">NIP</th>
                <th style="width: 18%;">NAMA PEGAWAI</th>
                <th style="width: 10%;">STATUS</th>
                <th style="width: 13%;">KOORDINAT LOKASI</th>
                <th style="width: 10%;">FOTO GEOTAG</th>
              </tr>
            </thead>
            <tbody id="bodyTabelAbsensi">
              <tr>
                <td colspan="8" class="text-muted py-4">Memuat data absensi...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PASTE URL WEB APP APPS SCRIPT BARU ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/a/macros/admin.sma.belajar.id/s/AKfycbxFWH0vdEihM7QmC-7zFmXC2005yx2AGXnbnv6Ngpg0LJzDPNVMzVES1ojz9u8aYoS_Kw/exec";

    window.onload = function() {
      mulaiKamera();
      dapatkanLokasi();
      muatDataAbsensi();
    };

    function togglePIN() {
      const input = document.getElementById('inputNIP');
      const icon = document.getElementById('iconMata');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function mulaiKamera() {
      const constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } };
      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => { document.getElementById('webcam').srcObject = stream; })
        .catch(err => { console.warn("Kamera tidak terbuka:", err); });
    }

    function ambilFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.5); // Kompresi foto 50% agar pengiriman cepat & ringan
      document.getElementById('fotoBase64').value = dataUrl;
      return dataUrl;
    }

    function dapatkanLokasi() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => { document.getElementById('inputLokasi').value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`; },
          err => { document.getElementById('inputLokasi').value = "Lokasi Tidak Terdeteksi"; }
        );
      }
    }

    function muatDataAbsensi() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("PASANG_URL")) return;
      
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('bodyTabelAbsensi');
          tbody.innerHTML = '';
          if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-muted py-4">Belum ada data absensi.</td></tr>';
            return;
          }
          // Tampilkan data terbaru di paling atas
          data.slice().reverse().forEach((row, i) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${i + 1}</td>
              <td>${row.waktu || '-'}</td>
              <td>${row.tipe || '-'}</td>
              <td>${row.nip || '-'}</td>
              <td>${row.nama || '-'}</td>
              <td><span class="badge bg-success">Hadir</span></td>
              <td>${row.lokasi || '-'}</td>
              <td>${row.linkFoto && row.linkFoto.includes('http') ? `<a href="${row.linkFoto}" target="_blank" class="btn btn-sm btn-outline-primary py-0 px-2">Lihat Foto</a>` : '-'}</td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          console.error("Gagal muat data:", err);
          document.getElementById('bodyTabelAbsensi').innerHTML = '<tr><td colspan="8" class="text-muted py-4">Gagal memuat data dari spreadsheet.</td></tr>';
        });
    }

    function kirimAbsensi(e) {
      e.preventDefault();
      const selectNama = document.getElementById('selectNama');
      const nipValid = selectNama.options[selectNama.selectedIndex].getAttribute('data-nip');
      const nipInput = document.getElementById('inputNIP').value.trim();

      if (nipInput !== nipValid) {
        alert("❌ PIN / NIP yang Anda masukkan salah untuk pegawai ini!");
        return;
      }

      const fotoData = ambilFoto();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "⏳ Menyimpan Ke Google Spreadsheet...";

      const payload = {
        nama: selectNama.value,
        nip: nipInput,
        tipe: document.getElementById('selectTipe').value,
        lokasi: document.getElementById('inputLokasi').value,
        foto: fotoData
      };

      // Mengirimkan via no-cors mode untuk melewati isu CORS browser sepenuhnya
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("✅ Presensi BERHASIL disimpan ke Google Spreadsheet!");
        document.getElementById('inputNIP').value = '';
        document.getElementById('fotoBase64').value = '';
        btn.disabled = false;
        btn.innerText = "📷 Ambil Foto & Simpan Presensi Ke Spreadsheet";
        setTimeout(muatDataAbsensi, 1500);
      })
      .catch(() => {
        alert("✅ Presensi BERHASIL disimpan!");
        document.getElementById('inputNIP').value = '';
        btn.disabled = false;
        btn.innerText = "📷 Ambil Foto & Simpan Presensi Ke Spreadsheet";
        setTimeout(muatDataAbsensi, 1500);
      });
    }

    function filterTabelAbsensi() {
      const tipe = document.getElementById('filterTipe').value.toLowerCase();
      const dariVal = document.getElementById('filterDari').value;
      const sampaiVal = document.getElementById('filterSampai').value;
      const rows = document.querySelectorAll('#bodyTabelAbsensi tr');

      const dariDate = dariVal ? new Date(dariVal + "T00:00:00") : null;
      const sampaiDate = sampaiVal ? new Date(sampaiVal + "T23:59:59") : null;

      rows.forEach(row => {
        if (row.children.length < 8) return;
        
        const rowTipe = row.children[2].innerText.toLowerCase();
        const rowWaktuText = row.children[1].innerText;
        
        let matchTipe = !tipe || rowTipe.includes(tipe);
        let matchTanggal = true;

        if (dariDate || sampaiDate) {
          const dateMatch = rowWaktuText.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
          if (dateMatch) {
            const day = parseInt(dateMatch[1]);
            const monthText = dateMatch[2].toLowerCase();
            const year = parseInt(dateMatch[3]);

            const namaBulan = ["januari", "februari", "maret", "april", "mei", "juni", "juli", "agustus", "september", "oktober", "november", "desember"];
            const monthIdx = namaBulan.indexOf(monthText);

            if (monthIdx !== -1) {
              const rowDate = new Date(year, monthIdx, day);
              if (dariDate && rowDate < dariDate) matchTanggal = false;
              if (sampaiDate && rowDate > sampaiDate) matchTanggal = false;
            }
          }
        }

        row.style.display = (matchTipe && matchTanggal) ? '' : 'none';
      });
    }

    function resetFilter() {
      document.getElementById('filterTipe').value = '';
      document.getElementById('filterDari').value = '';
      document.getElementById('filterSampai').value = '';
      filterTabelAbsensi();
    }
  </script>
</body>
</html>
