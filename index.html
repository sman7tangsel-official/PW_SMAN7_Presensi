<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi P3K PW SMAN 7 Tangsel</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card-header-custom { background-color: #ffffff; border-bottom: 2px solid #0d6efd; }
    @media print {
      .no-print { display: none !important; }
      .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
      .card { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="container my-4">
    <!-- Header Branding -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <div class="d-flex justify-content-between align-items-center">
          <img src="https://upload.wikimedia.org/wikipedia/commons/ thumb/a/a0/Logo_Provinsi_Banten.png/1200px-Logo_Provinsi_Banten.png" alt="Logo Banten" style="height: 60px;">
          <div>
            <h5 class="fw-bold mb-0">PEMERINTAH PROVINSI BANTEN</h5>
            <h4 class="fw-bold text-primary mb-0">SMAN 7 KOTA TANGERANG SELATAN</h4>
            <small class="text-muted">Sistem Absensi Kehadiran P3K Paruh Waktu</small>
          </div>
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Logo_Kota_Tangerang_Selatan.png/1200px-Logo_Kota_Tangerang_Selatan.png" alt="Logo Tangsel" style="height: 60px;">
        </div>
      </div>
    </div>

    <!-- Area Rekapitulasi Absensi Pegawai -->
    <div class="card shadow-sm">
      <div class="card-header card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h6 class="fw-bold mb-0 text-dark">📋 Rekapitulasi Absensi Pegawai</h6>
        
        <!-- Filter Baris: Tipe Absensi, Dari Tanggal, Sampai Tanggal, & Tombol Aksi -->
        <div class="d-flex align-items-center gap-2 flex-wrap ms-auto no-print">
          <!-- Dropdown Tipe Absensi -->
          <select id="filterTipe" class="form-select form-select-sm" style="width: auto;" onchange="filterTabelAbsensi()">
            <option value="">Semua Tipe</option>
            <option value="Absen Masuk">Absen Masuk</option>
            <option value="Absen Pulang">Absen Pulang</option>
          </select>

          <!-- Input Dari Tanggal -->
          <div class="d-flex align-items-center gap-1">
            <small class="fw-bold text-secondary">Dari:</small>
            <input type="date" id="filterDariTanggal" class="form-control form-control-sm" style="width: auto;" onchange="filterTabelAbsensi()">
          </div>

          <!-- Input Sampai Tanggal -->
          <div class="d-flex align-items-center gap-1">
            <small class="fw-bold text-secondary">Sampai:</small>
            <input type="date" id="filterSampaiTanggal" class="form-control form-control-sm" style="width: auto;" onchange="filterTabelAbsensi()">
          </div>

          <!-- Tombol Cetak / PDF -->
          <!-- KODE BARU (Arahkan langsung ke sheet Laporan/PDF Google Sheets) -->
<button class="btn btn-sm btn-success fw-bold" onclick="window.open('https://script.google.com/macros/s/AKfycbyJTQpF8rlIwBc_WuY22h1qV4hgGI0yW9VgxddBRs10KxedT5BWYPQ4T1lDztiHWb2aHA/exec?action=exportPdf', '_blank')">🖨️ Cetak / PDF</button>

          <!-- Tombol Bersihkan Filter -->
          <button class="btn btn-sm btn-danger fw-bold" onclick="resetFilterAbsensi()">Bersihkan</button>
        </div>
      </div>

      <div class="card-body p-0 table-responsive">
        <table class="table table-bordered table-striped align-middle mb-0" id="tabelAbsensi">
          <thead class="table-dark text-center align-middle">
            <tr>
              <th style="width: 5%;">NO</th>
              <th style="width: 20%;">TANGGAL & WAKTU</th>
              <th style="width: 12%;">TIPE</th>
              <th style="width: 15%;">NIP</th>
              <th style="width: 18%;">NAMA PEGAWAI</th>
              <th style="width: 8%;">STATUS</th>
              <th style="width: 12%;">KOORDINAT LOKASI</th>
              <th style="width: 10%;">FOTO GEOTAG</th>
            </tr>
          </thead>
          <tbody class="text-center">
            <!-- Data Absensi akan dimuat di sini secara otomatis -->
            <tr>
              <td colspan="8" class="text-muted py-4">Belum ada data absensi.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JavaScript Logika Filter & Cetak -->
  <script>
    // Fungsi Utama Filter Tabel Absensi (Berdasarkan Tipe dan Rentang Tanggal)
    function filterTabelAbsensi() {
      var inputTipe = document.getElementById('filterTipe').value.toLowerCase();
      var dariTglStr = document.getElementById('filterDariTanggal').value;   // Format: YYYY-MM-DD
      var sampaiTglStr = document.getElementById('filterSampaiTanggal').value; // Format: YYYY-MM-DD

      var dariDate = dariTglStr ? new Date(dariTglStr + 'T00:00:00') : null;
      var sampaiDate = sampaiTglStr ? new Date(sampaiTglStr + 'T23:59:59') : null;

      var rows = document.querySelectorAll('#tabelAbsensi tbody tr');

      rows.forEach(function(row) {
        // Abaikan baris jika hanya berisi teks pesan "Belum ada data"
        if (row.cells.length < 3) return;

        var waktuText = row.cells[1] ? row.cells[1].innerText.trim() : ''; // Kolom TANGGAL & WAKTU
        var tipeText = row.cells[2] ? row.cells[2].innerText.trim().toLowerCase() : ''; // Kolom TIPE

        // 1. Pengecekan Filter Tipe Absensi
        var cocokTipe = (inputTipe === '' || tipeText === inputTipe);

        // 2. Pengecekan Filter Rentang Tanggal
        var cocokTanggal = true;
        if (waktuText) {
          var rowDate = parseTanggalIndonesia(waktuText);
          if (rowDate) {
            if (dariDate && rowDate < dariDate) cocokTanggal = false;
            if (sampaiDate && rowDate > sampaiDate) cocokTanggal = false;
          }
        }

        // Tampilkan baris jika semua kriteria cocok, atau sembunyikan jika tidak cocok
        if (cocokTipe && cocokTanggal) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    // Fungsi Pembantu Konversi Tanggal Teks Indonesia (contoh: "Senin, 19 Oktober 2026...") ke Objek JS Date
    function parseTanggalIndonesia(textWaktu) {
      var namaBulan = {
        'januari': 0, 'februari': 1, 'maret': 2, 'april': 3, 'mei': 4, 'juni': 5,
        'juli': 6, 'agustus': 7, 'september': 8, 'oktober': 9, 'november': 10, 'desember': 11
      };

      // Mencocokkan pola tanggal (1-2 digit), nama bulan, dan tahun (4 digit)
      var match = textWaktu.toLowerCase().match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
      if (match) {
        var tgl = parseInt(match[1], 10);
        var bln = namaBulan[match[2]];
        var thn = parseInt(match[3], 10);

        if (bln !== undefined) {
          return new Date(thn, bln, tgl);
        }
      }
      return null;
    }

    // Fungsi Reset / Bersihkan Filter Tanggal & Tipe
    function resetFilterAbsensi() {
      document.getElementById('filterTipe').value = '';
      document.getElementById('filterDariTanggal').value = '';
      document.getElementById('filterSampaiTanggal').value = '';
      filterTabelAbsensi();
    }
  </script>

</body>
</html>
